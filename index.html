<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Game development, 3D animation and cinematic environments."
    />
    <meta name="theme-color" content="#080d20" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100,300;100,400;100,500;100,700;125,300&display=swap"
      rel="stylesheet"
    />
    <title>Gameplay Systems Programmer | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.hallmarkSlots = (images) => {
        for (const [name, image] of Object.entries(images)) {
          const slots = document.querySelectorAll(`[data-slot="${name}"]`);

          slots.forEach((slot) => {
            const img = new Image();
            img.src = typeof image === "string" ? image : image.src;
            img.alt =
              (typeof image === "object" && image.alt) || slot.dataset.alt || "";
            img.addEventListener("error", () => img.remove(), { once: true });
            slot
              .querySelectorAll(":scope > img")
              .forEach((existing) => existing.remove());
            slot.prepend(img);
          });
        }
      };

      document.querySelectorAll("[data-slot] img").forEach((img) => {
        if (img.complete && !img.naturalWidth) img.remove();
        else img.addEventListener("error", () => img.remove(), { once: true });
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
